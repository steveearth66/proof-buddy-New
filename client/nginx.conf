server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache index.html so browsers always fetch the latest version,
    # which references content-hashed JS/CSS filenames (cache-busted automatically).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Serve all other files; fall back to index.html for SPA routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
